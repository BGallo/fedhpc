[project]
name = "fedhpc"
version = "0.1.0"
description = "Multi-objective MIP scheduler for HPC jobs in federated multi-platform environments"
readme = "README.md"
authors = [
    { name = "Bernardo Gallo Victorino dos Santos", email = "bgallo@id.uff.br" }
]
requires-python = ">=3.14"
dependencies = [
    "gurobipy>=13.0.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
]

[project.scripts]
fedhpc = "fedhpc:main"

[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/fedhpc"]
cmake.build-type = "Release"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
