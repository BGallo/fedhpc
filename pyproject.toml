[project]
name = "fedhpc"
version = "0.1.0"
description = "Multi-objective MIP scheduler for HPC jobs in federated multi-platform environments"
readme = "README.md"
authors = [
    { name = "Bernardo Gallo Victorino dos Santos", email = "bgallo@id.uff.br" }
]
requires-python = ">=3.14"
dependencies = [
    "graphviz>=0.21",
    "gurobipy>=13.0.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
]

[project.scripts]
fedhpc          = "fedhpc:main"
fedhpc-ablation = "fedhpc.ablation:main"

[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/fedhpc"]
cmake.build-type = "Release"

[tool.uv]
# Rebuild the package (and its C++ extensions) on `uv run` / `uv sync`
# whenever these change, so a stale _moea .so never shadows an edited .hpp.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/fedhpc/_ext/*" },
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running exact solves (deselect with -m 'not slow')",
    "needs_full_license: builds a Gurobi model beyond the size-limited pip licence",
]
